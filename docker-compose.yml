services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    container_name: humoo-api
    working_dir: /var/www/html/apps/api
    volumes:
      # Keep PHP source in the image; mount only runtime-generated files.
      - ./apps/api/storage:/var/www/html/apps/api/storage:delegated
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env
    environment:
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-test:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    container_name: humoo-api-test
    working_dir: /var/www/html/apps/api
    volumes:
      - .:/var/www/html:delegated
      - humoo_api_test_vendor:/var/www/html/apps/api/vendor
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'
    entrypoint: ["sh", "-lc"]
    command: "composer install --no-interaction --prefer-dist --no-progress && php vendor/bin/phpunit"

  mysql:
    image: mysql:8.4
    container_name: humoo-mysql
    environment:
      MYSQL_DATABASE: humoo
      MYSQL_USER: humoo
      MYSQL_PASSWORD: humoo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - humoo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  humoo_mysql_data:
  humoo_api_test_vendor:
